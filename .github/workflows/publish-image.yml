name: Publish add-on image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vanhelsing2048/ha-contarina-bin-detector

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        shell: bash
        run: |
          version="$(sed -n 's/^version: "\(.*\)"/\1/p' contarina-bin-detector/config.yaml)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: contarina-bin-detector
          file: contarina-bin-detector/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.addon.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.addon.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
